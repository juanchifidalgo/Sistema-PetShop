<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#374151">
<meta name="description" content="Gestión del pet shop: stock, ventas, caja, agenda de peluquería y números del negocio.">
<title>Pet Shop</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body data-state="loading">
<a class="skip" href="#main">Saltar al contenido</a>

<div id="boot" class="boot" role="status">
  <div class="boot-mark" aria-hidden="true">🐾</div>
  <p id="boot-msg">Iniciando el sistema…</p>
  <small id="boot-sub">La primera vez del día puede tardar hasta un minuto.</small>
  <button id="boot-retry" class="btn primary" type="button" hidden>Reintentar</button>
</div>

<div id="login" class="login">
  <form id="loginform" class="loginbox" autocomplete="on" novalidate>
    <div class="brand2"><span aria-hidden="true">🐾</span> Gestión del pet shop</div>
    <h1>Ingresar</h1>
    <label class="fld" for="lemail"><span>Email</span><input id="lemail" name="email" type="email" autocomplete="username" required></label>
    <label class="fld" for="lpass"><span>Contraseña</span><input id="lpass" name="password" type="password" autocomplete="current-password" required></label>
    <p id="lerror" class="err" role="alert"></p>
    <button id="lbtn" class="btn primary" type="submit">Entrar</button>
  </form>
</div>

<div class="app" id="app">
  <aside class="side">
    <div class="brandrow">
      <div class="brand"><span class="mark" aria-hidden="true">🐾</span><div><b id="shopname">Pet Shop</b><small>Gestión del negocio</small></div></div>
      <button id="menubtn" class="menubtn" type="button" aria-controls="sidemenu" aria-expanded="false" aria-label="Abrir o cerrar el menú">☰</button>
    </div>
    <div id="sidemenu" class="sidemenu">
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="alerts" id="alerts"></div>
      <div class="side-foot" id="userbox"></div>
    </div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg" aria-modal="true"></dialog>
<div id="print" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
